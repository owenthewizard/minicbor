name: Documentation

on:
  push:
    branches: [docs/github-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: cargo doc --workspace --all-features --no-deps
      - name: Add landing page
        run: |
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><title>minicbor documentation</title><meta http-equiv="refresh" content="0; url=minicbor/index.html"><a href="minicbor/index.html">minicbor documentation</a></html>' > target/doc/index.html
          touch target/doc/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - uses: actions/deploy-pages@v4
        id: deploy
